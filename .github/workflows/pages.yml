name: build and publish display
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: tests
        run: python tests.py
      - name: geometry and segmentation tests
        run: |
          pip install numpy scipy scikit-image
          python tests_geometry.py
          python tests_segment.py
          python tests_pipeline.py
          python tests_ingest.py
      - name: regression check
        run: python run_replay.py scenarios/lc39a_20260904.json --check
      - name: emit display data
        run: python demo_pipeline.py -o docs/data
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
